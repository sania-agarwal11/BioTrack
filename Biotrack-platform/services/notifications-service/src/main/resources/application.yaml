server:
  port: 8084

spring:
  application:
    name: notifications-service
  datasource:
    url: jdbc:mysql://localhost:3306/biotrack_notifications
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect

  mail:
    host: smtp.gmail.com
    port: 587
    username:  ${MAIL_USERNAME}     # TODO: replace with actual Gmail address
    password: ${MAIL_PASSWORD}      # TODO: replace with Gmail App Password (not account password)
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
        debug: false

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

jwt:
  secret: ${JWT_SECRET}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

# ── Logging ───────────────────────────────────────────────────────────────────
logging:
  config: classpath:logback-spring.xml
  level:
    root: INFO
    com.biotrack: DEBUG
    org.springframework.security: WARN
    org.springframework.web: INFO
    org.springframework.mail: INFO
    org.hibernate.SQL: WARN
    com.netflix: WARN
